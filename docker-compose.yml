services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: shorturl-backend
    ports:
      - "8001:8001"
    env_file:
      - ./Backend/.env
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    container_name: shorturl-mongo
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
  frontend:
    build:
     context: ./frontend
    ports:
    - "3000:80"
    environment:
    - VITE_API_BASE=http://shorturl-backend:8001
    depends_on:
    - backend

  redis:
    image: redis:7
    container_name: shorturl-redis
    ports:
      - "6379:6379"

volumes:
  mongo_data:
